name: WireGuard Onboarding

on:
  workflow_dispatch:
    inputs:
      ENV_NAME:
        description: 'Environment / branch name to onboard'
        required: true
        type: string

jobs:
  onboard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create SSH key
        run: |
          echo "${{ secrets.WG_JUMPSERVER_SSH_KEY }}" > jump.pem
          chmod 600 jump.pem

      - name: Run onboarding
        run: |
          chmod +x scripts/wg-onboard.sh

          ./scripts/wg-onboard.sh \
            --env "${{ inputs.ENV_NAME }}" \
            --host "${{ secrets.WG_JUMPSERVER_HOST }}" \
            --ssh-key jump.pem \
            --repo "${{ github.repository }}"
